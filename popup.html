<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; font-size: 13px; width: 320px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 400px; overflow-y: auto; }
  li { display: flex; align-items: center; padding: 6px 10px; cursor: pointer; white-space: nowrap; }
  li:hover { background: #e0e0e0; }
  img { width: 16px; height: 16px; margin-right: 8px; flex-shrink: 0; }
  span { overflow: hidden; text-overflow: ellipsis; }
  .empty { padding: 10px; color: #666; }
</style>
</head>
<body>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
